            - heading "Respecter les autres" [level=3] [ref=f1e151]
            - generic [ref=f1e153]:
              - text: "Nous souhaitons maintenir un environnement respectueux pour tous. Pour cela, vous devez suivre les règles de conduite élémentaires suivantes :"
