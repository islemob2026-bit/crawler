                - listitem [ref=f1e124]: des appareils (comme Google Nest et Pixel).
            - paragraph [ref=f1e125]: Un grand nombre de ces services comprennent également des contenus que vous pouvez lire en streaming ou avec lesquels vous pouvez interagir.
            - paragraph [ref=f1e126]: Nos services sont conçus pour fonctionner ensemble, ce qui vous permet de passer plus facilement d'une activité à l'autre. Par exemple, si un événement d'agenda inclut une adresse, vous pouvez cliquer dessus pour que Maps vous indique l'itinéraire à suivre.
            - heading "Développer, améliorer et mettre à jour les services Google" [level=3] [ref=f1e127]
            - paragraph [ref=f1e129]: Nous développons en permanence de nouvelles technologies et fonctionnalités en vue d'améliorer nos services. Par exemple, nous utilisons l'intelligence artificielle et le machine learning (apprentissage automatique) pour vous proposer des traductions simultanées, ainsi que pour mieux détecter et bloquer le spam et les logiciels malveillants. Dans le cadre de ces améliorations continues, nous pouvons être amenés à ajouter ou supprimer des fonctionnalités, à modifier les limites ou les quotas applicables à nos services, à proposer de nouveaux services et à en abandonner d'autres. Si un service nécessite ou inclut l'utilisation d'un logiciel à télécharger ou préchargé, les mises à jour de ce logiciel (nouvelles versions ou fonctionnalités) sont susceptibles de s'effectuer automatiquement sur votre appareil. Certains services vous permettent de modifier les paramètres de mise à jour automatique.
            - paragraph [ref=f1e130]:
              - text: En cas de modifications importantes ayant un impact négatif sur votre utilisation de nos services ou de suppression d'un service, nous vous adresserons un préavis dans un délai raisonnable, sauf dans des situations urgentes, telles que la prévention d'abus ou la réponse à des obligations légales, ou en cas d'impératifs liés à des questions de sécurité ou de fonctionnalité. Nous vous offrirons également la possibilité d'exporter
              - button "vos contenus" [ref=f1e131] [cursor=pointer]
              - text: à partir de votre compte Google en utilisant l'outil
              - link "Google Takeout" [ref=f1e132] [cursor=pointer]:
                - /url: https://takeout.google.com/settings/takeout
              - text: ", sous réserve des lois et règles applicables."
            - heading "Ce que nous attendons de votre part" [level=2] [ref=f1e133]
            - heading "Respecter les présentes conditions et les conditions supplémentaires spécifiques à certains services" [level=3] [ref=f1e134]
            - generic [ref=f1e136]:
              - text: L'autorisation que nous vous donnons d'utiliser nos
              - button "services" [ref=f1e137] [cursor=pointer]
              - text: "et d'y accéder reste valable tant que vous respectez :"
              - list [ref=f1e138]:
                - listitem [ref=f1e139]: les présentes conditions d'utilisation ;
                - listitem [ref=f1e140]:
