                - /url: https://safety.google
              - text: ", notre"
              - link "Centre pour la transparence" [ref=f1e147] [cursor=pointer]:
                - /url: https://transparency.google/
              - text: ainsi que d'autres pages accessibles depuis le
              - link "site dédié à nos Règles" [ref=f1e148] [cursor=pointer]:
                - /url: /?client_theme=light
              - text: . Enfin, nous pouvons être amenés à fournir des instructions et des avertissements spécifiques dans nos services (par exemple, des boîtes de dialogue qui vous alertent sur des informations importantes).
            - paragraph [ref=f1e149]:
              - text: Même si nous vous autorisons à utiliser nos services, sachez que nous conservons l'ensemble des
