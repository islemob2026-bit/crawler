                - link "programmes de sécurité et de test de bugs" [ref=f1e170] [cursor=pointer]:
                  - /url: https://bughunters.google.com/
              - listitem [ref=f1e171]: "En accédant à nos services ou contenus, ou en les utilisant, de manière frauduleuse ou trompeuse, que ce soit, par exemple :"
              - list [ref=f1e172]:
                - listitem [ref=f1e173]: En recourant à l'hameçonnage
                - listitem [ref=f1e174]: En créant de faux comptes ou contenus, y compris de faux avis
                - listitem [ref=f1e175]: En induisant les autres en erreur en leur faisant croire qu'un contenu d'IA générative a été créé par un humain
                - listitem [ref=f1e176]: En fournissant des services qui semblent provenir de vous (ou de quelqu'un d'autre) alors qu'ils proviennent en réalité de nous
              - listitem [ref=f1e177]: En fournissant des services qui semblent provenir de nous alors que ce n'est pas le cas
              - listitem [ref=f1e178]: En utilisant nos services (y compris les contenus qu'ils fournissent) pour enfreindre les droits légaux d'autrui, tels que les droits de propriété intellectuelle ou au respect de la vie privée
              - listitem [ref=f1e179]: En procédant à la rétro-ingénierie de nos services ou de la technologie sous-jacente telle que nos modèles de machine learning (apprentissage automatique) pour soutirer des secrets commerciaux ou d'autres informations exclusives, sauf dans le cadre permis par la loi applicable
              - listitem [ref=f1e180]: En utilisant des moyens automatisés pour accéder au contenu de l'un de nos services sans respecter les instructions lisibles par machine sur nos pages Web (par exemple, les fichiers robots.txt qui interdisent l'exploration, la formation ou d'autres activités)
              - listitem [ref=f1e181]: En utilisant du contenu généré par IA par le biais de nos services pour développer des modèles de machine learning ou des technologies d'IA associées
              - listitem [ref=f1e182]: En cachant ou en déformant qui vous êtes afin d'enfreindre les présentes conditions
              - listitem [ref=f1e183]: En fournissant des services qui encouragent autrui à enfreindre ces conditions
            - heading "Autorisation d'utiliser votre contenu" [level=3] [ref=f1e184]
