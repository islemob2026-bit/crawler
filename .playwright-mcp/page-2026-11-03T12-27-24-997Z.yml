                  - link "Conditions supplémentaires spécifiques à certains services" [ref=f1e142] [cursor=pointer]:
                    - /url: /terms/service-specific?client_theme=light
                  - text: qui peuvent, par exemple, inclure des limites d'âge supplémentaires.
            - paragraph [ref=f1e143]:
              - text: Nous mettons également à votre disposition divers règlements, centres d'aide et autres ressources pour répondre à vos questions courantes et vous donner une idée des conditions dans lesquelles vous pouvez utiliser nos services. Ces ressources comprennent nos
              - link "Règles de confidentialité" [ref=f1e144] [cursor=pointer]:
