            - heading "Ne pas utiliser nos services de façon abusive" [level=3] [ref=f1e164]
            - paragraph [ref=f1e165]: "La plupart des personnes qui accèdent à nos services ou les utilisent comprennent les règles générales qui maintiennent Internet comme un espace ouvert et sécurisé. Malheureusement, quelques personnes ne respectent pas ces règles que nous décrivons donc ici afin de protéger nos services et nos utilisateurs contre les utilisations abusives. En conséquence :"
