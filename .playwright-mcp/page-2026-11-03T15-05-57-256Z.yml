                - generic [ref=f3e380]:
                  - strong [ref=f3e382]: "Objet :"
                  - generic [ref=f3e383]: "La présente consultation vise à la mise en place d’un SAD en vue de la passation de Marchés spécifiques ayant pour objet de : • fournir un service de maintenance régional ou infrarégional comprenant des prestations d’entretien et de maintenance préventive et corrective, de désincarcération et de téléalarme d’ascenseurs hydrauliques et électriques, monte-malades, monte-charges, monte-handicapés et élévateurs/plateformes pour personne à mobilité réduite-EPMR, monte-plats, monte dossiers, tables élévatrices/élévateurs/niveleurs de quai, escaliers mécaniques et trottoirs roulants, et tout appareil assurant le transport automatique vertical ou horizontal de personnes et/ou de charges, dénommés génériquement « appareils ou élévateurs » au titre de la procédure, de toute marque et des prestations associées ; • répondre aux besoins des Acheteurs, tels que définis dans le présent règlement de la consultation, notamment par le recours à un marché distinct lorsque l’offre issue de l’accord-cadre du Resah portant sur des prestations identiques ne permet pas de répondre de manière satisfaisante à leur situation spécifique, cet accord-cadre étant, à la date de mise en place du présent SAD, identifié sous le numéro 2025-R025. Afin de garantir l’exclusivité accordée au titulaire de l’accord-cadre précité et le droit du Resah de mettre en place des solutions alternatives conformément à la vocation d’exhaustivité propre à la centrale d’achat, le titulaire de cet accord-cadre ne peut être candidat au présent SAD pendant toute sa durée de validité, soit huit (8) ans, en application des stipulations contractuelles qui le lient au Resah au titre de l’accord-cadre concerné."
